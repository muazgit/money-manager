name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew || true

      - name: Restore Consistent Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring persistent debug keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
            cp debug.keystore app/debug.keystore || true
            echo "Keystore successfully restored."
          elif [ -f debug.keystore ]; then
            cp debug.keystore app/debug.keystore || true
          else
            echo "Fallback: generating keystore"
            keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 \
              -validity 10000 -alias androiddebugkey \
              -keypass android -storepass android \
              -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore app/debug.keystore || true
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release-artifacts/app-release.apk
            echo "Found APK at $APK_PATH, copied to release-artifacts/app-release.apk"
          else
            echo "Error: No APK found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.2
          name: Taka Manager v1.2.2
          draft: false
          prerelease: false
          files: release-artifacts/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
